{% extends 'library/index.html' %}

{% block body %}
<div class="container mt-5">
    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                {{ field.label_tag }}
                {{ field }}

                {% for error in field.errors %}
                    <div class="text-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">
            Submit
        </button>
    </form>
</div>
{% endblock body %}
