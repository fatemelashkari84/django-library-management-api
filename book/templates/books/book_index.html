{% extends 'library/index.html' %}

{% block body %}

<div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
        <div class="col-md-10 col-lg-8 col-xl-7">
            <!-- Post preview-->
            {% for book in books %}

                <div class="post-preview">
                    <a href="{% url 'book_info' book.id%}">
                        <h2 class="post-title">{{book.title}}</h2>
                    </a>
                    <p class="post-meta">
                        Wroted by {{book.author}}
                        on {{book.created_at}}
                    </p>
                </div>
            {% endfor %}

            <hr class="my-4" />
            <!-- Pager-->
        </div>
    </div>
</div>


{% endblock body %}
